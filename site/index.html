    <script>
      // Applies the visitor's stored (or system-preferred) theme before first paint,
      // matching the product's own lanekeeper_theme / lanekeeper_theme_mode keys so
      // there is no flash of the wrong palette.
      (function () {
        try {
          var theme = localStorage.getItem('lanekeeper_theme') || 'lanekeeper';
          var mode = localStorage.getItem('lanekeeper_theme_mode');
          if (mode !== 'light' && mode !== 'dark') {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-mode', mode);
          root.classList.add(mode);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
