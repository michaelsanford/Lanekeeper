<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan-buoy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="indigo-buoy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect width="192" height="192" rx="42" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Left swimlane divider cable -->
  <line x1="44" y1="20" x2="44" y2="172" stroke="#0284c7" stroke-width="3" opacity="0.6"/>
  <!-- Left swimlane buoy floats -->
  <rect x="33" y="32" width="22" height="20" rx="8" fill="url(#cyan-buoy)" filter="url(#glow)"/>
  <rect x="33" y="70" width="22" height="20" rx="8" fill="url(#cyan-buoy)"/>
  <rect x="33" y="108" width="22" height="20" rx="8" fill="url(#cyan-buoy)"/>
  <rect x="33" y="146" width="22" height="20" rx="8" fill="url(#cyan-buoy)"/>

  <!-- Right swimlane divider cable -->
  <line x1="148" y1="20" x2="148" y2="172" stroke="#4f46e5" stroke-width="3" opacity="0.6"/>
  <!-- Right swimlane buoy floats -->
  <rect x="137" y="32" width="22" height="20" rx="8" fill="url(#indigo-buoy)" filter="url(#glow)"/>
  <rect x="137" y="70" width="22" height="20" rx="8" fill="url(#indigo-buoy)"/>
  <rect x="137" y="108" width="22" height="20" rx="8" fill="url(#indigo-buoy)"/>
  <rect x="137" y="146" width="22" height="20" rx="8" fill="url(#indigo-buoy)"/>

  <!-- Center Lane: Forward Beacon (Keep In Lane) -->
  <path d="M96 38 L124 90 L96 79 L68 90 Z" fill="url(#arrow-grad)" filter="url(#glow)"/>
  <path d="M96 48 L114 84 L96 76 L78 84 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Center Lane: Pool bottom tracking guide line -->
  <line x1="96" y1="106" x2="96" y2="128" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <line x1="96" y1="144" x2="96" y2="166" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
</svg>
