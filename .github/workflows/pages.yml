name: Deploy site to Pages

# Builds site/ and deploys it directly to GitHub Pages via the Actions
# artifact pipeline -- nothing built is ever committed to the repository.
# Requires a one-time repo setting: Settings > Pages > Source >
# "GitHub Actions".
#
# Path filters keep this from running on every push -- backend-only or
# docs-prose-only commits do not trigger a deploy.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'frontend/src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Pages deployments queue rather than cancel each other, so a deploy in
# progress always finishes and the latest push always lands last.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build:site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
